name: Build and Test

# Pull requests validate proposed changes. Pushes to main verify the result after merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/npm-test.yaml@npm-test-v1
    permissions:
      contents: read
    with:
      # Match the major version of the node image in this repo's Dockerfile (node:lts-alpine).
      node-version: "26"
      # Builds only for now: the specs don't compile on main, so CI doesn't run them yet. This is the
      # Dockerfile's production build, so a pull request catches a broken production build.
      test-command: npx ng build gameboard-ui -c production
      coverage-path: ""
